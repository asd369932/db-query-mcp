[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-query-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants query databases safely: read-only enforced, SQL validated, results capped."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "database", "sql", "sqlite", "ai", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
db-query-mcp = "db_query_mcp.server:main"

[project.urls]
Homepage = "https://github.com/asd369932/db-query-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/db_query_mcp"]
